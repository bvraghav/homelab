# Build the docs site (docs/) with md-preview and publish it to GitHub Pages.
# Adapted from md-preview's own site workflow.
#
# Follows git flow: pushes to develop and pull requests build and check
# only; pushes to master (that is, finished releases and hotfixes) also
# deploy. A manual run deploys only when started on master.
#
# One-time setup: Settings → Pages → Build and deployment → Source:
# "GitHub Actions". To publish under a custom domain, set the repository
# variable SITE_URL (Settings → Secrets and variables → Actions →
# Variables), e.g. https://docs.example.com/ ; it's used for sitemap.xml.

name: site

on:
  push:
    branches: [master, develop]
    paths:
      - 'docs/**'
      - 'Makefile'
      - '.github/workflows/site.yml'
  pull_request:
    paths:
      - 'docs/**'
      - 'Makefile'
      - '.github/workflows/site.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

env:
  PANDOC_VERSION: "3.11"
  MD_PREVIEW_VERSION: "0.2.4"
  # GitHub Pages hosts are lowercase; set vars.SITE_URL if the owner isn't.
  SITE_URL: ${{ vars.SITE_URL || format('https://{0}.github.io/{1}/', github.repository_owner, github.event.repository.name) }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # full history: sitemap.xml dates pages by their last commit

      - name: Install pandoc ${{ env.PANDOC_VERSION }}
        run: |
          curl -fsSL -o "$RUNNER_TEMP/pandoc.deb" \
            "https://github.com/jgm/pandoc/releases/download/${PANDOC_VERSION}/pandoc-${PANDOC_VERSION}-1-amd64.deb"
          sudo apt-get install -y "$RUNNER_TEMP/pandoc.deb"
          pandoc --version | head -1

      - name: Install md-preview ${{ env.MD_PREVIEW_VERSION }}
        run: |
          git clone -q --depth 1 --branch "v${MD_PREVIEW_VERSION}" \
            https://github.com/bvraghav/md-preview "$RUNNER_TEMP/md-preview"
          echo "$RUNNER_TEMP/md-preview/bin" >> "$GITHUB_PATH"

      - name: Cache KaTeX and mermaid
        uses: actions/cache@v6
        with:
          path: ~/.local/share/md-preview/vendor
          key: md-preview-vendor-${{ env.MD_PREVIEW_VERSION }}

      - name: Build site
        run: |
          md-preview version
          make fetch site SITE_URL="$SITE_URL"

      - name: Check links
        run: make check

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/master'
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    name: deploy (master only)
    if: github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v6
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
