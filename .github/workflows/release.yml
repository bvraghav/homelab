# Create the GitHub release for a version tag, from RELEASE_NOTES.md.
#
#   push a version tag (vX.Y.Z)   create the release, or update it if it exists
#   manual run with a tag         the same, for an existing tag, e.g. to fix
#                                 its notes after the release
#
# A tag push reads RELEASE_NOTES.md as it is at the tag. A manual run reads
# it from the branch the run is started on ("Use workflow from"), so notes
# can be corrected on develop and re-published without moving the tag. The
# version check and the compare link always use the tag.
#
# The title is "v" + the tag's section heading in RELEASE_NOTES.md without
# its date; the description is that section's text, plus a "Full Changelog"
# link from the previous version tag. scripts/release-notes.sh does the
# extracting, so `scripts/release-notes.sh --body --repo <url> X.Y.Z`
# previews it locally.
#
# A release cycle with git flow (this repo's tag prefix is "v"):
#
#   git flow release start X.Y.Z
#   # bump VERSION; add the X.Y.Z sections to CHANGELOG.md and RELEASE_NOTES.md
#   git flow release finish -m "X.Y.Z: Title" X.Y.Z
#   git push upstream master develop vX.Y.Z
#
# The site workflow deploys the docs for the same tag.

name: release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag, e.g. v0.0.3
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
      REPO_URL: ${{ github.server_url }}/${{ github.repository }}
      # Where RELEASE_NOTES.md is read from: the tag itself on a tag push (or
      # a manual run started on a tag), otherwise the branch the run was
      # started on.
      NOTES_REF: ${{ github.ref_type == 'tag' && github.ref_name || format('origin/{0}', github.ref_name) }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0   # all tags, to find the previous version

      - name: Check tag, VERSION and notes agree
        run: |
          [[ $TAG =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::not a version tag: $TAG"; exit 1; }
          version="${TAG#v}"
          file="$(cat VERSION)"
          if [ "$version" != "$file" ]; then
            echo "::error::tag $TAG doesn't match VERSION ($file)"
            exit 1
          fi
          grep -qE "^## \[${version//./\\.}\]" CHANGELOG.md \
            || { echo "::error::no [$version] section in CHANGELOG.md"; exit 1; }

      - name: Build title and description
        run: |
          echo "Release notes from $NOTES_REF"
          git show "$NOTES_REF:RELEASE_NOTES.md" > "$RUNNER_TEMP/RELEASE_NOTES.md"
          notes="$RUNNER_TEMP/RELEASE_NOTES.md"
          scripts/release-notes.sh --file "$notes" --title "$TAG" > "$RUNNER_TEMP/title.txt"
          scripts/release-notes.sh --file "$notes" --body --repo "$REPO_URL" "$TAG" > "$RUNNER_TEMP/notes.md"
          echo "## $(cat "$RUNNER_TEMP/title.txt")" >> "$GITHUB_STEP_SUMMARY"
          cat "$RUNNER_TEMP/notes.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Create or update the release
        run: |
          title="$(cat "$RUNNER_TEMP/title.txt")"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "$title" --notes-file "$RUNNER_TEMP/notes.md"
            echo "Updated release $TAG"
          else
            gh release create "$TAG" --verify-tag --title "$title" --notes-file "$RUNNER_TEMP/notes.md"
            echo "Created release $TAG"
          fi
