# From secrets/woodpecker.sops.yaml: the OAuth application made in Forgejo
# for Woodpecker. Woodpecker's server reads it as environment variables.
apiVersion: v1
kind: Secret
metadata:
  name: woodpecker-forgejo
  namespace: {{ .Release.Namespace }}
type: Opaque
stringData:
  WOODPECKER_FORGEJO_CLIENT: {{ required "WOODPECKER_FORGEJO_CLIENT is missing" .Values.WOODPECKER_FORGEJO_CLIENT | quote }}
  WOODPECKER_FORGEJO_SECRET: {{ required "WOODPECKER_FORGEJO_SECRET is missing" .Values.WOODPECKER_FORGEJO_SECRET | quote }}
